label: 'Events import XML'
id: utevent_import_xml
description: 'Imports an XML file to the Event content type.'
help: ''
import_period: 3600
import_period_per_feed: false
fetcher: http
fetcher_configuration:
  auto_detect_feeds: false
  use_pubsubhubbub: false
  always_download: false
  fallback_hub: ''
  request_timeout: 30
parser: xml
parser_configuration:
  context:
    value: /response/item
  source_encoding:
    - auto
  display_errors: false
  line_limit: 100
  use_tidy: false
processor: 'entity:node'
processor_configuration:
  values:
    type: utevent_event
  langcode: en
  insert_new: 1
  update_existing: 2
  update_non_existent: _keep
  skip_hash_check: false
  skip_validation: false
  skip_validation_types: {  }
  authorize: true
  revision: false
  expire: -1
  owner_feed_author: false
  owner_id: 1

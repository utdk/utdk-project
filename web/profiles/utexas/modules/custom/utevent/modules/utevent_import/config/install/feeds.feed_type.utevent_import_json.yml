label: 'Events import JSON'
id: utevent_import_json
description: 'Imports a JSON file to the Event content type.'
help: ''
import_period: 3600
import_period_per_feed: false
fetcher: http
fetcher_configuration:
  auto_detect_feeds: false
  use_pubsubhubbub: false
  always_download: false
  fallback_hub: ''
  request_timeout: 30
parser: jsonpath
parser_configuration:
  context:
    value: '$.*'
  source_encoding:
    - auto
  display_errors: false
  line_limit: 100
processor: 'entity:node'
processor_configuration:
  values:
    type: utevent_event
  langcode: en
  insert_new: 1
  update_existing: 2
  update_non_existent: _keep
  skip_hash_check: false
  skip_validation: false
  skip_validation_types: {  }
  authorize: true
  revision: false
  expire: -1
  owner_feed_author: false
  owner_id: 1
custom_sources:
  utevent_uuid_json:
    value: uuid
    label: UUID
    machine_name: utevent_uuid_json
    type: json
  utevent_title_json:
    value: title
    label: Title
    machine_name: utevent_title_json
    type: json
  utevent_path_json:
    value: path
    label: Path
    machine_name: utevent_path_json
    type: json
  utevent_start_json:
    value: start
    label: Start
    machine_name: utevent_start_json
    type: json
  utevent_end_json:
    value: end
    label: End
    machine_name: utevent_end_json
    type: json
  utevent_duration_json:
    value: duration
    label: Duration
    machine_name: utevent_duration_json
    type: json
  utevent_body_json:
    value: body
    label: Body
    machine_name: utevent_body_json
    type: json
  utevent_summary_json:
    value: summary
    label: Summary
    machine_name: utevent_summary_json
    type: json
  utevent_status_json:
    value: status
    label: Status
    machine_name: utevent_status_json
    type: json
  utevent_ocation_json:
    value: location
    label: Location
    machine_name: utevent_location_json
    type: json
  utevent_tags_json:
    value: tags
    label: Tags
    machine_name: utevent_tags_json
    type: json
  utevent_featured_json:
    value: featured
    label: Featured
    machine_name: utevent_featured_json
    type: json
  utevent_image_url_json:
    value: image-url
    label: 'Image URL'
    machine_name: utevent_image_url_json
    type: json
  utevent_image_alt_json:
    value: image-alt
    label: 'Image alt'
    machine_name: utevent_image_alt_json
    type: json
  utevent_image_title_json:
    value: image-title
    label: 'Image title'
    machine_name: utevent_image_title_json
    type: json
mappings:
  -
    target: title
    map:
      value: utevent_title_json
    settings:
      language: null
    unique: {  }
  -
    target: path
    map:
      alias: utevent_path_json
      pathauto: ''
    settings:
      language: null
  -
    target: field_utevent_datetime
    map:
      value: utevent_start_json
      end_value: utevent_end_json
      rrule: ''
      duration: utevent_duration_json
      timezone: ''
    settings:
      language: null
  -
    target: field_utevent_body
    map:
      value: utevent_body_json
      summary: utevent_summary_json
    settings:
      language: ''
      format: flex_html
  -
    target: field_utevent_status
    map:
      value: utevent_status_json
    settings:
      language: null
  -
    target: field_utevent_location
    map:
      target_id: utevent_ocation_json
    settings:
      language: ''
      reference_by: name
      autocreate: 1
      autocreate_bundle: utevent_location
  -
    target: field_utevent_tags
    map:
      target_id: utevent_tags_json
    settings:
      language: ''
      reference_by: name
      autocreate: 1
      autocreate_bundle: utevent_tags
  -
    target: field_utevent_featured
    map:
      value: utevent_featured_json
    settings:
      language: null
  -
    target: feeds_item
    map:
      url: ''
      guid: utevent_uuid_json
    settings: {  }
    unique:
      guid: 1
  -
    target: field_utevent_main_media
    map:
      target_id: utevent_image_url_json
    settings:
      language: ''
      reference_by: mid
      autocreate: 0
      autocreate_bundle: utexas_image
  -
    target: temporary_target
    map:
      temporary: utevent_image_alt_json
  -
    target: temporary_target
    map:
      temporary: utevent_image_title_json
